<!doctype html>
<!--
  Maya Family Daycare — single-file site.

  HOW TO EDIT THIS FILE
  ---------------------
  Everything a human needs to change lives in the CONTENT object right below
  the <style> block. Text, phone number, hours, photo filenames — all of it.
  The markup and the script further down never contain a hard-coded string or
  image path, so you should never have to hunt through the HTML.

  To change a photo: overwrite the file in assets/ keeping the SAME filename.
  No edit to this file is needed.

  Anything marked [PLACEHOLDER] is invented sample copy and must be replaced
  before this site is shown to parents. While DRAFT.enabled is true, those
  spots are also flagged visually on the page itself.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9f3">
<!-- Static fallback title (business name only, so it can't drift out of sync
     with the copy). The full localized title is set from CONTENT by the script. -->
<title>Maya Family Daycare</title>

<!-- =====================================================================
     SOCIAL PREVIEW (Open Graph) — what shows when the link is pasted into
     WhatsApp, Messages, or Facebook.

     These are the one block of copy that CANNOT come from the CONTENT object.
     WhatsApp and Facebook scrapers do not run JavaScript; they read the raw
     HTML and stop. Anything written here by the script would be invisible to
     them, so these values are deliberately duplicated as static text.
     If the wording below changes, change CONTENT.es.docTitle /
     docDescription to match — they are meant to say the same thing.

     They are also static in LANGUAGE: one page, one set of tags, so the
     preview cannot follow the on-page toggle. They are in Spanish on purpose,
     since she shares the link with Spanish-speaking parents.

     Every URL here must be absolute. Relative paths are silently dropped by
     every scraper — this is the single most common reason a preview card
     comes out blank.
     ===================================================================== -->
<link rel="canonical" href="https://website-to-business.github.io/maya-family-daycare/">
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="Maya Family Daycare">
<meta property="og:url"         content="https://website-to-business.github.io/maya-family-daycare/">
<meta property="og:title"       content="Maya Family Daycare — Cuidado infantil en casa en Palmdale, CA">
<meta property="og:description" content="Cuidado en un hogar de familia en Palmdale: recién nacidos desde las 2 semanas hasta los 12 años. Comidas caseras, ayuda con la tarea y patio con sombra. Llame al (661) 313-8262.">
<meta property="og:locale"      content="es_US">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:image"            content="https://website-to-business.github.io/maya-family-daycare/assets/og-patio.jpg">
<meta property="og:image:secure_url" content="https://website-to-business.github.io/maya-family-daycare/assets/og-patio.jpg">
<meta property="og:image:type"   content="image/jpeg">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"    content="El patio de Maya Family Daycare, con velas de sombra, casita de juegos y juguetes para montar">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Maya Family Daycare — Cuidado infantil en casa en Palmdale, CA">
<meta name="twitter:description" content="Cuidado en un hogar de familia en Palmdale: recién nacidos desde las 2 semanas hasta los 12 años. Comidas caseras, ayuda con la tarea y patio con sombra.">
<meta name="twitter:image"       content="https://website-to-business.github.io/maya-family-daycare/assets/og-patio.jpg">

<style>
  /* ---------------------------------------------------------------------
     Design tokens. The palette nods to the pink/purple/blue of the existing
     logo and the jungle wall motif without matching their exact saturation.
     --------------------------------------------------------------------- */
  :root{
    --cream:#fff9f3;
    --cream-deep:#fdeee2;
    --ink:#2c2140;
    --muted:#6c6180;
    --pink:#ef5f96;
    --pink-deep:#d63f7b;
    --purple:#7a58c9;
    --purple-deep:#5d3ea6;
    --blue:#2f9fd6;
    --sun:#ffc24b;
    --leaf:#3f9c74;
    --line:rgba(44,33,64,.12);
    --card:#ffffff;
    --shadow-sm:0 1px 2px rgba(44,33,64,.06), 0 2px 8px rgba(44,33,64,.05);
    --shadow-md:0 2px 6px rgba(44,33,64,.06), 0 12px 28px rgba(44,33,64,.09);
    --r-sm:12px; --r-md:18px; --r-lg:28px; --r-xl:36px;
    --pad:20px;
    --bar-h:72px; /* height of the fixed mobile call bar */
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font:400 17px/1.65 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Nunito,"Trebuchet MS",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* Room for the fixed call bar on phones so the footer isn't covered. */
  body{padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px))}
  img{max-width:100%;display:block}
  a{color:var(--purple-deep)}
  h1,h2,h3{line-height:1.15;margin:0;letter-spacing:-.02em;font-weight:800}
  h1{font-size:clamp(31px,7.4vw,54px)}
  h2{font-size:clamp(25px,5.4vw,38px)}
  h3{font-size:clamp(19px,3.4vw,22px)}
  p{margin:0}
  :focus-visible{outline:3px solid var(--purple);outline-offset:3px;border-radius:6px}

  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 var(--pad)}
  .section{padding:56px 0}
  .section > .wrap > * + *{margin-top:22px}
  .lead{color:var(--muted);font-size:clamp(17px,2.4vw,19px);max-width:60ch}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--purple-deep);
  }
  .kicker::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--pink)}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(255,249,243,.88);
    backdrop-filter:saturate(150%) blur(10px);
    -webkit-backdrop-filter:saturate(150%) blur(10px);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  header.is-stuck{border-bottom-color:var(--line);box-shadow:0 6px 20px rgba(44,33,64,.05)}
  .bar{display:flex;align-items:center;gap:12px;min-height:64px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto;min-width:0}
  .brand .mark{
    width:38px;height:38px;flex:none;border-radius:13px;
    background:linear-gradient(140deg,var(--pink),var(--purple) 55%,var(--blue));
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;
    box-shadow:var(--shadow-sm);
  }
  .brand .name{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Language toggle — always visible, at the top and again in the footer. */
  .lang{display:inline-flex;background:rgba(122,88,201,.10);border-radius:999px;padding:3px;flex:none}
  .lang button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:14px;font-weight:700;color:var(--purple-deep);
    padding:10px 15px;border-radius:999px;min-height:44px;
  }
  .lang button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
  .footer .lang{background:rgba(255,255,255,.14)}
  .footer .lang button{color:rgba(255,255,255,.85)}
  .footer .lang button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink)}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    font:inherit;font-weight:800;text-decoration:none;cursor:pointer;
    padding:15px 22px;min-height:54px;border-radius:999px;border:2px solid transparent;
    transition:transform .12s ease, box-shadow .2s ease, background-color .2s ease;
    text-align:center;
  }
  .btn:active{transform:translateY(1px)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-call{
    background:linear-gradient(135deg,var(--pink),var(--purple-deep));
    color:#fff;box-shadow:0 8px 22px rgba(122,88,201,.34);font-size:19px;padding:17px 28px;min-height:60px;
  }
  .btn-wa{background:#eaf7f0;color:#1c6b48;border-color:rgba(31,138,90,.22)}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm)}
  .btn-head{display:none}
  .btn-block{width:100%}

  /* ---------- hero ---------- */
  .hero{position:relative;padding:34px 0 46px;overflow:hidden}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;pointer-events:none;z-index:0}
  .hero::before{width:340px;height:340px;background:rgba(239,95,150,.30);top:-140px;right:-110px}
  .hero::after{width:300px;height:300px;background:rgba(47,159,214,.24);bottom:-150px;left:-120px}
  .hero .wrap{position:relative;z-index:1}
  .hero h1{margin-top:14px}
  .hero h1 em{font-style:normal;color:var(--purple-deep)}
  .hero .lead{margin-top:14px}
  .hero-cta{display:flex;flex-direction:column;gap:10px;margin-top:26px}
  .hero-note{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:4px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--leaf);flex:none;box-shadow:0 0 0 4px rgba(63,156,116,.18)}
  .dot.is-closed{background:var(--muted);box-shadow:0 0 0 4px rgba(108,97,128,.16)}
  .hero-photo{margin-top:30px;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-md);transform:rotate(-.5deg)}
  .hero-photo .ph{aspect-ratio:4/3}

  /* ---------- photo placeholder ---------- */
  /* Until the real photos land in assets/, a missing file renders as a
     labelled panel instead of a broken-image icon. Harmless once the real
     files exist — the fallback only shows on load error. */
  .ph{position:relative;background:var(--cream-deep);overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph.is-missing{
    background:
      repeating-linear-gradient(135deg,rgba(122,88,201,.07) 0 12px,rgba(122,88,201,.13) 12px 24px),
      var(--cream-deep);
    display:grid;place-items:center;padding:22px;min-height:180px;
  }
  .ph.is-missing img{display:none}
  .ph-label{
    text-align:center;font-size:13px;font-weight:700;color:var(--purple-deep);
    background:rgba(255,255,255,.9);border-radius:var(--r-sm);padding:10px 14px;
    max-width:26ch;line-height:1.4;box-shadow:var(--shadow-sm);
  }

  /* ---------- at a glance ---------- */
  .glance{display:grid;gap:12px}
  .g-card{
    background:var(--card);border-radius:var(--r-md);padding:18px 18px 20px;
    box-shadow:var(--shadow-sm);border:1px solid var(--line);
    display:flex;gap:14px;align-items:flex-start;
  }
  .g-icon{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(122,88,201,.12);color:var(--purple-deep)}
  .g-icon svg{width:22px;height:22px}
  .g-card:nth-child(2) .g-icon{background:rgba(239,95,150,.13);color:var(--pink-deep)}
  .g-card:nth-child(3) .g-icon{background:rgba(47,159,214,.13);color:#1c6f97}
  .g-card:nth-child(4) .g-icon{background:rgba(63,156,116,.14);color:#2b7a58}
  .g-label{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .g-value{margin-top:3px;font-weight:700}
  .g-note{margin-top:2px;font-size:14.5px;color:var(--muted);font-weight:400}

  .hours-list{margin:0;padding:0;list-style:none;font-size:15.5px}
  .hours-list li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .hours-list .d{color:var(--muted);min-width:0}
  .hours-list .t{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hours-list li.is-today .d,.hours-list li.is-today .t{color:var(--purple-deep)}

  /* ---------- the space ---------- */
  .space{background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 42%,var(--cream) 100%)}
  /* Grouped gallery: outdoors first, then rooms, then the infant room. */
  .g-group + .g-group{margin-top:40px}
  .g-group-title{
    font-size:clamp(20px,3.6vw,25px);
    display:flex;align-items:center;gap:12px;
  }
  .g-group-title::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--line)}
  .g-group-intro{color:var(--muted);margin:8px 0 0;max-width:60ch}
  .g-group .gallery{margin-top:18px}
  .gallery{display:grid;gap:14px}
  .g-item{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);border:1px solid var(--line)}
  .g-item .ph{aspect-ratio:4/3}
  .g-item figcaption{padding:14px 18px 17px;font-size:15px;color:var(--muted)}
  .g-item figcaption b{display:block;color:var(--ink);font-size:16.5px;margin-bottom:2px}
  .feature-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding:0;list-style:none}
  .feature-chips li{
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:9px 15px;font-size:14.5px;font-weight:700;box-shadow:var(--shadow-sm);
  }

  /* ---------- programs ---------- */
  .programs{display:grid;gap:16px}
  .p-card{
    position:relative;background:var(--card);border-radius:var(--r-lg);
    padding:24px 22px;box-shadow:var(--shadow-sm);border:1px solid var(--line);
    border-top:5px solid var(--pink);
  }
  .p-card:nth-child(2){border-top-color:var(--sun)}
  .p-card:nth-child(3){border-top-color:var(--blue)}
  .p-age{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .p-card h3{margin:6px 0 8px}
  /* A card carrying a `highlight` in CONTENT leads with it — used for the
     two-week newborn intake, which is the real differentiator here. */
  .p-card.is-featured{
    background:linear-gradient(168deg,rgba(239,95,150,.10),rgba(122,88,201,.07) 60%,var(--card));
    box-shadow:var(--shadow-md);
  }
  .p-highlight{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--pink),var(--purple-deep));
    color:#fff;font-weight:800;font-size:14.5px;line-height:1.25;
    padding:9px 15px;border-radius:999px;margin-bottom:12px;
    box-shadow:0 6px 16px rgba(122,88,201,.28);
  }
  .p-highlight svg{width:17px;height:17px;flex:none}
  /* Photo at the top of a program card, showing that age group's own room. */
  .p-photo{
    aspect-ratio:4/3;border-radius:var(--r-md);overflow:hidden;
    margin:-4px 0 16px;border:1px solid var(--line);
  }

  /* House-from-the-street shot beside the directions button. */
  .contact-photo{margin:24px 0 0}
  .contact-photo .ph{aspect-ratio:16/10;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
  .p-list{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:15.5px}
  .p-list li{display:flex;gap:9px;align-items:flex-start;color:var(--muted)}
  .p-list li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--leaf);flex:none;margin-top:8px}

  /* ---------- meals ---------- */
  .meals .wrap{
    background:linear-gradient(135deg,rgba(255,194,75,.18),rgba(239,95,150,.13));
    border:1px solid var(--line);border-radius:var(--r-xl);padding:30px 22px;max-width:1040px;
  }
  .meals .wrap > * + *{margin-top:14px}

  /* ---------- about / testimonials ---------- */
  .about-card{background:var(--card);border-radius:var(--r-lg);padding:26px 22px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .about-card > * + *{margin-top:14px}
  .quotes{display:grid;gap:14px}
  .quote{
    background:var(--card);border-radius:var(--r-lg);padding:22px;
    box-shadow:var(--shadow-sm);border:1px solid var(--line);
  }
  .quote p{color:var(--muted)}
  .quote cite{display:block;margin-top:12px;font-style:normal;font-weight:700;font-size:15px}

  /* ---------- contact ---------- */
  .contact .wrap{
    background:var(--card);border-radius:var(--r-xl);padding:30px 22px;
    box-shadow:var(--shadow-md);border:1px solid var(--line);
  }
  .contact-actions{display:grid;gap:10px;margin-top:22px}
  .contact-hint{margin-top:16px;font-size:14.5px;color:var(--muted)}

  /* ---------- footer ---------- */
  .footer{background:var(--ink);color:rgba(255,255,255,.82);padding:44px 0 34px;margin-top:20px}
  .footer h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:800}
  .footer a{color:#fff;text-decoration-color:rgba(255,255,255,.4);text-underline-offset:3px}
  .f-grid{display:grid;gap:28px}
  .f-col > * + *{margin-top:10px}
  .footer .hours-list .d{color:rgba(255,255,255,.6)}
  .footer .hours-list li.is-today .d,.footer .hours-list li.is-today .t{color:var(--sun)}
  .f-bottom{
    margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    font-size:14px;color:rgba(255,255,255,.6);
  }
  .socials{display:flex;gap:10px;flex-wrap:wrap}
  .socials a{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:44px;padding:0 16px;border-radius:999px;
    background:rgba(255,255,255,.10);text-decoration:none;font-size:15px;font-weight:700;
  }

  /* License slot. The number is confirmed and printed; the empty-state styling
     below still applies if business.license.number is ever cleared. */
  .license{
    border:1px dashed rgba(255,255,255,.32);border-radius:var(--r-sm);
    padding:12px 14px;font-size:14.5px;
  }
  .license .lic-label{color:rgba(255,255,255,.6);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
  .license .lic-value{font-weight:700;color:#fff;font-variant-numeric:tabular-nums;margin-top:4px}
  .license .lic-empty{color:rgba(255,255,255,.5);font-style:italic;margin-top:4px}

  /* ---------- fixed mobile call bar ---------- */
  .callbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));
    background:rgba(255,249,243,.94);
    backdrop-filter:saturate(150%) blur(10px);
    -webkit-backdrop-filter:saturate(150%) blur(10px);
    border-top:1px solid var(--line);
    display:flex;gap:10px;
  }
  .callbar .btn{flex:1;min-height:52px;padding:13px 16px;font-size:17px}
  .callbar .btn-wa{flex:0 0 auto}

  /* ---------- draft flags ---------- */
  /* Visible only while DRAFT.enabled is true in CONTENT. */
  .flag{
    display:inline-flex;align-items:center;gap:6px;vertical-align:middle;
    background:#fff3d6;color:#8a5b00;border:1px solid #f0d089;
    border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;margin-left:8px;
  }
  .footer .flag{background:rgba(255,194,75,.18);color:var(--sun);border-color:rgba(255,194,75,.35)}
  .draftbar{
    background:#fff3d6;color:#7a5100;border-bottom:1px solid #f0d089;
    font-size:14px;padding:10px var(--pad);text-align:center;
  }
  .draftbar b{font-weight:800}
  [hidden]{display:none !important}

  /* ---------- narrow phones ---------- */
  /* Keeps the business name in the header from truncating next to the
     language toggle on a small screen. */
  @media (max-width:430px){
    .lang button{padding:11px 9px;font-size:13px}
    header .brand .mark{width:32px;height:32px;border-radius:11px;font-size:15px}
    header .brand{gap:8px}
    header .brand .name{font-size:14.5px}
    .bar{gap:8px;min-height:60px}
  }
  @media (max-width:380px){
    header .brand .name{font-size:13.5px}
  }

  /* ---------- wider screens ---------- */
  @media (min-width:640px){
    :root{--pad:28px}
    .hero-cta{flex-direction:row;flex-wrap:wrap;align-items:center}
    .hero-cta .btn{width:auto}
    .glance{grid-template-columns:repeat(2,1fr)}
    .gallery{grid-template-columns:repeat(2,1fr)}
    .g-item.is-lead{grid-column:1 / -1}
    .programs{grid-template-columns:repeat(2,1fr)}
    .contact-actions{grid-template-columns:repeat(2,1fr)}
    .quotes{grid-template-columns:repeat(2,1fr)}
    .meals .wrap,.contact .wrap{padding:38px 34px}
    .about-card{padding:32px 30px}
  }
  @media (min-width:900px){
    body{padding-bottom:0} /* call bar is hidden on desktop */
    .callbar{display:none}
    .btn-head{display:inline-flex;padding:11px 20px;min-height:46px;font-size:16px}
    .section{padding:78px 0}
    .hero{padding:56px 0 76px}
    .hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:46px;align-items:center}
    .hero-photo{margin-top:0}
    /* The photos are landscape, so keep the hero frame landscape too. */
    .hero-photo .ph{aspect-ratio:4/3;max-height:520px}
    /* auto-fit rather than a fixed 4, so the row stays balanced when a card
       is switched off (the subsidy card currently is). */
    .glance{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
    .g-card{flex-direction:column;gap:14px}
    .gallery{grid-template-columns:repeat(2,1fr)}
    .g-item.is-lead{grid-column:1 / -1}
    .g-item.is-lead .ph{aspect-ratio:16/9}

<script>
/* ---------------------------------------------------------------------
   Rendering. Nothing below holds copy or image paths — it only reads
   CONTENT and puts values where the data- attributes say they go.

   Attributes used in the markup above:
     data-t="key"          → element text, from the active language
     data-t="es.langLabel" → a fixed language's string (for the toggle)
     data-t="business.x"   → a language-independent business value
     data-t-aria="key"     → aria-label
     data-t-alt="key"      → alt text on the <img> inside a .ph
     data-t-missing="key"  → label shown if the photo file isn't there yet
     data-img="key"        → photo, from CONTENT.images
     data-cta="call|whatsapp|email|directions" → builds the right href
     data-flag             → gets a "sample" badge while DRAFT.enabled
   --------------------------------------------------------------------- */
(function () {
  "use strict";

  var B = CONTENT.business;
  var lang = "en";

  /* ---------- small helpers ---------- */

  function L() { return CONTENT[lang]; }

  // "business.phone" / "es.langLabel" / "heroSub"
  function lookup(path) {
    var parts = path.split(".");
    var node = parts.length > 1 ? CONTENT : L();
    for (var i = 0; i < parts.length; i++) {
      if (node == null) return "";
      node = node[parts[i]];
    }
    return node == null ? "" : node;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fmtTime(hm) {
    var h = hm[0], m = hm[1];
    var suffix = h >= 12 ? L().pm : L().am;
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ":" + (m < 10 ? "0" + m : m) + " " + suffix;
  }

  function addressLine() {
    var tail = B.city + ", " + B.state;
    return CONTENT.settings.showStreetAddress ? B.street + ", " + tail + " " + B.zip : tail;
  }

  function mapsUrl() {
    if (B.mapsUrlOverride) return B.mapsUrlOverride;
    var q = [B.name, B.street, B.city, B.state, B.zip].join(", ");
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q);
  }

  function ctaHref(kind) {
    if (kind === "call") return "tel:" + B.phoneDial;
    if (kind === "whatsapp") return "https://wa.me/" + B.whatsapp + "?text=" + encodeURIComponent(L().whatsappPrefill);
    if (kind === "directions") return mapsUrl();
    if (kind === "email") {
      return "mailto:" + B.email +
        "?subject=" + encodeURIComponent(L().emailSubject) +
        "&body=" + encodeURIComponent(L().emailBody);
    }
    return "#";
  }

  /* Photos. A missing file (nothing in assets/ yet) falls back to a labelled
     panel rather than a broken image. */
  function fillPhoto(box, imageKey, altText, missingText) {
    var img = box.querySelector("img");
    box.classList.remove("is-missing");
    var old = box.querySelector(".ph-label");
    if (old) old.remove();
    img.alt = altText || "";
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = function () {
      box.classList.add("is-missing");
      if (!box.querySelector(".ph-label")) box.appendChild(el("div", "ph-label", missingText || ""));
    };
    img.src = CONTENT.images[imageKey];
  }

  function newPhoto(spec) {
    var box = el("div", "ph");
    box.appendChild(document.createElement("img"));
    // No explicit `missing` label on a photo → fall back to its alt text.
    fillPhoto(box, spec.image, spec.alt, spec.missing || spec.alt);
    return box;
  }

  /* Small decorative mark for a highlighted program card. */
  function starIcon() {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "currentColor");
    svg.setAttribute("aria-hidden", "true");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M12 2.6l2.5 5.6 6.1.6-4.6 4.1 1.3 6-5.3-3.1-5.3 3.1 1.3-6L3.4 8.8l6.1-.6z");
    svg.appendChild(path);
    return svg;
  }

  /* Draft badge, so invented copy is impossible to miss on the page. */
  function flag(node) {
    if (!DRAFT.enabled) return;
    node.appendChild(el("span", "flag", L().flag));
  }

  /* ---------- open / closed right now ---------- */

  function todayRow() {
    var d = new Date().getDay();
    for (var i = 0; i < B.hours.length; i++) {
      if (B.hours[i].days.indexOf(d) !== -1) return B.hours[i];
    }
    return null;
  }

  function renderStatus() {
    var row = todayRow();
    var now = new Date();
    var mins = now.getHours() * 60 + now.getMinutes();
    var open = false, text;

    if (row && !row.closed) {
      var from = row.open[0] * 60 + row.open[1];
      var to = row.close[0] * 60 + row.close[1];
      open = mins >= from && mins < to;
      text = open
        ? L().openNow + " · " + L().todayHours + " " + fmtTime(row.open) + " – " + fmtTime(row.close)
        : L().closedNow + " · " + L().opensAt + " " + fmtTime(row.open);
    } else {
      text = L().closedNow;
    }

    document.getElementById("statusText").textContent = text;
    document.getElementById("statusDot").classList.toggle("is-closed", !open);
  }

  /* ---------- list sections ---------- */

  function renderHours() {
    var today = todayRow();
    each("[data-hours]", function (list) {
      list.textContent = "";
      B.hours.forEach(function (row) {
        var li = el("li");
        if (row === today) li.className = "is-today";
        li.appendChild(el("span", "d", L().dayLabels[row.key]));
        li.appendChild(el("span", "t", row.closed ? L().closedLabel : fmtTime(row.open) + " – " + fmtTime(row.close)));
        list.appendChild(li);
      });
    });
  }

  /* The gallery is grouped, not one flat grid: outdoors first and largest,
     then the rooms, then the infant room. A photo marked lead:true runs the
     full width of its group. */
  function renderGallery() {
    var host = document.querySelector("[data-gallery]");
    host.textContent = "";

    L().photoGroups.forEach(function (group) {
      var section = el("div", "g-group");
      section.appendChild(el("h3", "g-group-title", group.title));
      if (group.intro) section.appendChild(el("p", "g-group-intro", group.intro));

      var grid = el("div", "gallery");
      group.photos.forEach(function (spec) {
        var fig = el("figure", "g-item" + (spec.lead ? " is-lead" : ""));
        fig.appendChild(newPhoto(spec));
        var cap = el("figcaption");
        cap.appendChild(el("b", null, spec.title));
        cap.appendChild(document.createTextNode(spec.caption));
        fig.appendChild(cap);
        grid.appendChild(fig);
      });
      section.appendChild(grid);
      host.appendChild(section);
    });

    var chips = document.querySelector("[data-chips]");
    chips.textContent = "";
    L().spaceChips.forEach(function (c) { chips.appendChild(el("li", null, c)); });
  }

  function renderPrograms() {
    var host = document.querySelector("[data-programs]");
    host.textContent = "";
    L().programs.forEach(function (p) {
      var card = el("div", "p-card");
      // An optional `image` puts the room this age group actually uses at the
      // top of its card, rather than leaving all the photos in one gallery.
      if (p.image) {
        var shot = newPhoto({ image: p.image, alt: p.imageAlt });
        shot.className = "ph p-photo";
        card.appendChild(shot);
      }
      // An optional `highlight` promotes the card and leads with a badge.
      if (p.highlight) {
        card.className = "p-card is-featured";
        var badge = el("span", "p-highlight");
        badge.appendChild(starIcon());
        badge.appendChild(el("span", null, p.highlight));
        card.appendChild(badge);
      }
      card.appendChild(el("div", "p-age", p.age));
      card.appendChild(el("h3", null, p.title));
      card.appendChild(el("p", "lead", p.body));
      var ul = el("ul", "p-list");
      p.points.forEach(function (pt) { ul.appendChild(el("li", null, pt)); });
      card.appendChild(ul);
      // Same as the meals note: a question for the repo owner, not copy.
      if (p.note && DRAFT.enabled) {
        var note = el("p", "lead", p.note);
        note.style.fontSize = "14.5px";
        note.style.marginTop = "14px";
        flag(note);
        card.appendChild(note);
      }
      host.appendChild(card);
    });
  }

  /* Real reviews only. While the list is empty the section shows the
     placeholder note instead — it never renders an invented quote. */
  function renderQuotes() {
    var host = document.querySelector("[data-quotes]");
    var empty = document.querySelector("[data-quotes-empty]");
    var list = L().quotes || [];
    host.textContent = "";
    empty.hidden = list.length > 0;
    list.forEach(function (q) {
      var card = el("div", "quote");
      card.appendChild(el("p", null, q.text));
      card.appendChild(el("cite", null, q.name));
      host.appendChild(card);
    });
  }

  function renderSocials() {
    var host = document.querySelector("[data-socials]");
    host.textContent = "";
    B.socials.forEach(function (s) {
      if (!s.url) return;                 // no url → no link, no empty icon
      var a = el("a", null, s.label);
      a.href = s.url;
      a.target = "_blank";
      a.rel = "noopener";
      host.appendChild(a);
    });
  }

  /* License slot: prints the number only if one has actually been entered. */
  function renderLicense() {
    var value = document.querySelector("[data-license-value]");
    var empty = document.querySelector("[data-license-empty]");
    var num = (B.license.number || "").trim();
    var has = num.length > 0;
    value.hidden = !has;
    empty.hidden = has;
    if (has) value.textContent = (B.license.type ? B.license.type + " · " : "") + num;
    else if (DRAFT.enabled && !empty.querySelector(".flag")) flag(empty);
  }

  /* Structured data for Google, built from the same CONTENT values. */
  function renderJsonLd() {
    var data = {
      "@context": "https://schema.org",
      "@type": "ChildCare",
      name: B.name,
      description: L().docDescription,
      telephone: B.phoneDial,
      url: location.href.split("#")[0],
      address: {
        "@type": "PostalAddress",
        streetAddress: B.street,
        addressLocality: B.city,
        addressRegion: B.state,
        postalCode: B.zip,
        addressCountry: "US",
      },
      openingHoursSpecification: B.hours.filter(function (r) { return !r.closed; }).map(function (r) {
        var names = { 0: "Sunday", 1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday", 5: "Friday", 6: "Saturday" };
        return {
          "@type": "OpeningHoursSpecification",
          dayOfWeek: r.days.map(function (d) { return names[d]; }),
          opens: pad(r.open), closes: pad(r.close),
        };
      }),
    };
    var tag = document.getElementById("jsonld") || (function () {
      var s = document.createElement("script");
      s.type = "application/ld+json";
      s.id = "jsonld";
      document.head.appendChild(s);
      return s;
    })();
    tag.textContent = JSON.stringify(data);
  }

  function pad(hm) {
    return (hm[0] < 10 ? "0" + hm[0] : hm[0]) + ":" + (hm[1] < 10 ? "0" + hm[1] : hm[1]);
  }

  /* ---------- language ---------- */

  function each(sel, fn) {
    Array.prototype.forEach.call(document.querySelectorAll(sel), fn);
  }

  function render() {
    document.documentElement.lang = L().htmlLang;
    document.title = L().docTitle;

    var meta = document.querySelector('meta[name="description"]') || (function () {
      var m = document.createElement("meta");
      m.name = "description";
      document.head.appendChild(m);
      return m;
    })();
    meta.content = L().docDescription;

    each("[data-t]", function (n) {
      n.textContent = lookup(n.getAttribute("data-t"));
      if (n.hasAttribute("data-flag")) flag(n);
    });
    each("[data-t-aria]", function (n) { n.setAttribute("aria-label", lookup(n.getAttribute("data-t-aria"))); });
    each("[data-address]", function (n) { n.textContent = addressLine(); });

    /* Sections that are built but switched off in CONTENT.settings. `hidden`
       collapses them entirely, so no padding or margin is left behind. */
    each("[data-section]", function (n) {
      n.hidden = !CONTENT.settings[n.getAttribute("data-section")];
    });

    /* Working notes addressed to whoever maintains this file — never parent
       facing. They exist only to be answered and replaced, so they disappear
       with the rest of the draft scaffolding. */
    each("[data-draft-only]", function (n) { n.hidden = !DRAFT.enabled; });
    each("[data-copyright]", function (n) {
      n.textContent = "© " + new Date().getFullYear() + " " + B.name + ". " + L().footerRights;
    });

    each("[data-cta]", function (n) {
      var kind = n.getAttribute("data-cta");
      // Email is hidden entirely until an address is confirmed.
      if (kind === "email") {
        var holder = n.parentElement && n.parentElement.tagName === "P" ? n.parentElement : n;
        holder.hidden = !B.email;
        if (!B.email) return;
      }
      n.href = ctaHref(kind);
    });

    each(".ph[data-img]", function (box) {
      fillPhoto(box, box.getAttribute("data-img"), lookup(box.getAttribute("data-t-alt")), lookup(box.getAttribute("data-t-missing")));
    });

    each("[data-lang]", function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });

    var banner = document.getElementById("draftBanner");
    banner.hidden = !DRAFT.enabled;
    banner.textContent = L().draftBanner;

    document.getElementById("skipLink").textContent = L().skipToContent;

    renderHours();
    renderStatus();
    renderGallery();
    renderPrograms();
    renderQuotes();
    renderSocials();
    renderLicense();
    renderJsonLd();
  }

  function setLang(next, remember) {
    lang = CONTENT[next] ? next : "en";
    // Remembers the visitor's choice, so the toggle isn't a per-page-load chore.
    if (remember) { try { localStorage.setItem("mfd-lang", lang); } catch (e) {} }
    render();
  }

  /* Language on first load:
     1. a choice made on a previous visit wins
     2. otherwise Spanish if the browser is set to Spanish
     3. otherwise English (the default)
     The toggle is always on screen either way. */
  function initialLang() {
    var saved = null;
    try { saved = localStorage.getItem("mfd-lang"); } catch (e) {}
    if (saved && CONTENT[saved]) return saved;
    var nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    return nav.indexOf("es") === 0 ? "es" : "en";
  }

  each("[data-lang]", function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang"), true); });
  });

  document.getElementById("skipLink").addEventListener("focus", function () { this.style.left = "20px"; });
  document.getElementById("skipLink").addEventListener("blur", function () { this.style.left = "-9999px"; });

  var header = document.getElementById("siteHeader");
  addEventListener("scroll", function () {
    header.classList.toggle("is-stuck", scrollY > 8);
  }, { passive: true });

  setLang(initialLang(), false);
  setInterval(renderStatus, 60000); // keep open/closed honest if the page stays open
})();
</script>

</body>
</html>
